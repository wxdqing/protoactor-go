syntax = "proto3";
package proto;
option go_package = "grain/proto";

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

service Hello {
  rpc SayHello (HelloRequest) returns (HelloResponse) {}
}

message PingRequest {
  string name = 1;
}

message PingResponse {
  string message = 1;
}

service Manual {
  rpc Ping (PingRequest) returns (PingResponse) {}
}