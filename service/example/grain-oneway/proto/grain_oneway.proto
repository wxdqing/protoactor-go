syntax = "proto3";

package grainoneway;

import "options/options.proto";

option go_package = "github.com/asynkron/protoactor-go/service/example/grain-oneway/proto";
message PingRequest {
  uint64 server_id = 1;
}

message PingResponse {
  int64 server_time = 1;
}

service Player {
  option (options.kind) = "player";
  option (options.module) = "player";

  rpc Ping(PingRequest) returns (PingResponse) {
    option (options.method_options) = { oneway: true };
  }
}
